[project]
name = "ppt-presenter"
version = "0.1.0"
description = "PowerPoint presenter-action controller and live tester for a future AI presenter agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pywin32>=306"]

[project.scripts]
ppt-presenter = "ppt_presenter.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ppt_presenter*"]
